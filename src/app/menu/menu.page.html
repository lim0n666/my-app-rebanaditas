<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Menú</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Tarjeta de encabezado con acceso rápido a Perfil -->
  <ion-card button routerLink="/perfil" style="border-radius: 14px; margin-top: 4px;">
    <ion-card-content style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #ffe4ef; display: flex; align-items: center; justify-content: center;">
          <ion-icon name="person-circle-outline" color="primary" style="font-size: 34px;"></ion-icon>
        </div>
        <div>
          <h2 style="margin: 0; font-weight: bold; font-size: 1.05rem;">{{ nombreUsuario }}</h2>
          <p style="margin: 2px 0 0; font-size: 0.82rem; color: gray;">
            {{ correoUsuario || 'Ver y editar mi perfil' }}
          </p>
        </div>
      </div>
      <ion-icon name="chevron-forward-outline" color="medium"></ion-icon>
    </ion-card-content>
  </ion-card>

  <!-- Sección 1: Compras y Administración -->
  <ion-list inset="true" style="border-radius: 14px;">
    <ion-item-divider>
      <ion-label>Mi actividad</ion-label>
    </ion-item-divider>

    <ion-item button routerLink="/historial-compras" detail="true">
      <ion-icon slot="start" name="time-outline" color="primary"></ion-icon>
      <ion-label>Historial de compras</ion-label>
    </ion-item>

    @if (esAdmin) {
      <ion-item button routerLink="/productos" detail="true">
        <ion-icon slot="start" name="pricetags-outline" color="primary"></ion-icon>
        <ion-label>Panel / Gestionar productos</ion-label>
      </ion-item>
    }
  </ion-list>

  <!-- Sección 2: Comunidad y Opinión -->
  <ion-list inset="true" style="border-radius: 14px;">
    <ion-item-divider>
      <ion-label>Comunidad y opinión</ion-label>
    </ion-item-divider>

    <ion-item button routerLink="/comentarios" detail="true">
      <ion-icon slot="start" name="chatbubbles-outline" color="primary"></ion-icon>
      <ion-label>Comentarios y reseñas</ion-label>
    </ion-item>
  </ion-list>

  <!-- Sección 3: Redes Sociales -->
  <ion-list inset="true" style="border-radius: 14px;">
    <ion-item-divider>
      <ion-label>Redes sociales</ion-label>
    </ion-item-divider>

    <ion-item button (click)="abrirRedSocial('https://www.instagram.com/sweet_rebanaditas/')" detail="true">
      <ion-icon slot="start" name="logo-instagram" style="color: #E1306C;"></ion-icon>
      <ion-label>Instagram</ion-label>
    </ion-item>

    <ion-item button (click)="abrirRedSocial('https://www.facebook.com/')" detail="true">
      <ion-icon slot="start" name="logo-facebook" style="color: #1877F2;"></ion-icon>
      <ion-label>Facebook</ion-label>
    </ion-item>

    <ion-item button (click)="abrirRedSocial('https://twitter.com/')" detail="true">
      <ion-icon slot="start" name="logo-twitter" style="color: #1DA1F2;"></ion-icon>
      <ion-label>Twitter / X</ion-label>
    </ion-item>

    <ion-item button (click)="abrirRedSocial('https://www.youtube.com/')" detail="true">
      <ion-icon slot="start" name="logo-youtube" style="color: #FF0000;"></ion-icon>
      <ion-label>YouTube</ion-label>
    </ion-item>
  </ion-list>

  <!-- Botón de Cerrar Sesión -->
  <div class="ion-padding-horizontal ion-margin-top ion-margin-bottom">
    <ion-button expand="block" fill="outline" color="danger" (click)="cerrarSesion()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      Cerrar sesión
    </ion-button>
  </div>
</ion-content>
