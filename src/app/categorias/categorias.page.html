<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ion-text-center ion-margin-bottom">
    <h2 style="font-weight: bold;">Categorías de productos</h2>
    <p style="color: gray;">Explora las categorías del catálogo</p>
  </div>

  <ion-grid>
    <ion-row>
      @for (categoria of categorias; track categoria) {
        <ion-col size="6">
          <ion-card button (click)="seleccionarCategoria(categoria)" style="border-radius: 14px;">
            <ion-card-content class="ion-text-center">
              <div style="width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; background: #ffe4ef; display: flex; align-items: center; justify-content: center;">
                <ion-icon
                  [name]="obtenerIconoCategoria(categoria)"
                  style="font-size: 32px; color: var(--ion-color-primary);">
                </ion-icon>
              </div>

              <ion-card-title style="font-size: 1.1rem; font-weight: bold;">
                {{ nombreCategoria(categoria) }}
              </ion-card-title>
              <p style="font-size: 0.8rem; margin-top: 5px; color: gray;">
                Explorar {{ nombreCategoria(categoria).toLowerCase() }}
              </p>
            </ion-card-content>
          </ion-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
