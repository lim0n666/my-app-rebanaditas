

<ion-content>

  <div class="login">

    <div class="contenedor-login">

     <!-- LOGO -->
      <div class="logo" style="display: flex; align-items: center; justify-content: center;">
        <ion-icon name="person-outline" style="font-size: 54px; color: var(--ion-color-primary);"></ion-icon>
      </div>

      <!-- ENCABEZADO -->
      <div class="titulo">
        <h1>Postres que enamoran</h1>
        <p>Bienvenido</p>
      </div>

      <!-- FORMULARIO -->
      <div class="formulario">

        <!-- CORREO -->
        <div class="campo">
          <ion-input
            type="email"
            label="Correo electrónico"
            labelPlacement="floating"
            placeholder="Ingresa tu correo"
            [(ngModel)]="correo">
          </ion-input>
        </div>
        <!-- CONTRASEÑA -->
        <div class="campo">
          <ion-input
            [type]="mostrarPassword ? 'text' : 'password'"
            label="Contraseña"
            labelPlacement="floating"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="password">
          </ion-input>
        </div>

        <!-- MOSTRAR CONTRASEÑA -->
        <ion-button
          type="button"
          fill="clear"
          size="small"
          class="mostrar-password"
          (click)="cambiarVisibilidadPassword()">

          {{ mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña' }}

        </ion-button>

        <!-- ERROR -->
        @if (mensajeError) {
          <div class="mensaje-error">
            {{ mensajeError }}
          </div>
        }
        <!-- BOTÓN LOGIN -->
        <ion-button
          expand="block"
          class="boton-login"
          (click)="iniciarSesion()">

          INICIAR SESIÓN

        </ion-button>

        <!-- REGISTRO -->
        <div class="registro">

          <ion-text>¿No tienes una cuenta?</ion-text>

          <ion-button
            type="button"
            fill="clear"
            class="boton-registro"
            (click)="irARegistro()">

            Regístrate

          </ion-button>

        </div>

      </div>

    </div>

  </div>
</ion-content>
