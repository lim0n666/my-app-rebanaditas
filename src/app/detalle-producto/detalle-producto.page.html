<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Postres que enamoran</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (producto) {
    <ion-card>
      <img [src]="producto.imagen" [alt]="producto.nombre" />
      
      <ion-card-header>
        <ion-card-title>{{ producto.nombre }}</ion-card-title>
        <ion-card-subtitle color="success" style="font-size: 1.2rem;">
          ${{ producto.precio }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-text color="dark">
          <p><strong>Detalles del producto</strong></p>
          <p>{{ producto.descripcion }}</p>
        </ion-text>

        <!-- ion-grid para colocar los controles y el botón lado a lado -->
        <ion-grid class="ion-no-padding ion-margin-top">
          <ion-row class="ion-align-items-center">
            
            <ion-col size="5" style="display: flex; align-items: center; justify-content: space-between; padding-right: 10px;">
              <ion-button fill="outline" size="small" (click)="disminuirCantidad()">-</ion-button>
              <ion-text><strong>{{ cantidad }}</strong></ion-text>
              <ion-button fill="outline" size="small" (click)="aumentarCantidad()">+</ion-button>
            </ion-col>
            
            <ion-col size="7">
              <ion-button expand="block" (click)="agregarAlCarrito()">
                Agregar al carrito
              </ion-button>
            </ion-col>

          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  }
</ion-content>
